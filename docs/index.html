<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <!--  <base href="/">-->

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="doctor_demo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>doctor_demo</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --primary-color: #2563eb;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--primary-color), rgba(37, 99, 235, 0.9), rgba(37, 99, 235, 0.9));
      overflow: hidden;
    }

    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, var(--primary-color), rgba(37, 99, 235, 0.9), rgba(37, 99, 235, 0.9));
      z-index: 9999;
      transition: opacity 0.5s ease-out;
      animation: backgroundPulse 3s ease-in-out infinite;
    }

    .loading-container.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .logo-container {
      margin-bottom: 30px;
      animation: logoFloat 3s ease-in-out infinite;
    }

    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(45deg, var(--primary-color), rgba(37, 99, 235, 0.8));
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3);
      position: relative;
      overflow: hidden;
    }

    .logo::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transform: rotate(45deg);
      animation: shimmer 2s linear infinite;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background-image: url('assets/images/logo.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      z-index: 1;
    }

    .app-name {
      color: white;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .app-tagline {
      color: rgba(255, 255, 255, 0.8);
      font-size: 16px;
      font-weight: 400;
      margin-bottom: 40px;
    }

    .spinner-container {
      position: relative;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loading-dots {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      animation: dotPulse 1.4s ease-in-out infinite both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    .dot:nth-child(3) { animation-delay: 0s; }

    .loading-text {
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      margin-top: 20px;
      animation: textFade 2s ease-in-out infinite;
    }

    @keyframes backgroundPulse {
      0%, 100% {
        background: linear-gradient(135deg, var(--primary-color), rgba(37, 99, 235, 0.8), rgba(37, 99, 235, 0.9));
      }
      50% {
        background: linear-gradient(135deg, var(--primary-color), rgba(37, 99, 235, 1.0), rgba(37, 99, 235, 0.9));
      }
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
      100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes dotPulse {
      0%, 80%, 100% {
        transform: scale(0);
        opacity: 0.5;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes textFade {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* Responsive design */
    @media (max-width: 768px) {
      .app-name {
        font-size: 24px;
      }

      .app-tagline {
        font-size: 14px;
      }

      .logo {
        width: 70px;
        height: 70px;
      }

      .logo-icon {
        font-size: 28px;
      }
    }

    /* Hide the loading screen when Flutter is ready */
    .flutter-ready .loading-container {
      display: none;
    }
  </style>
</head>
<body>
<!-- Loading Screen -->
<div id="loading" class="loading-container">
  <div class="logo-container">
    <div class="logo">
      <div class="logo-icon"></div>
    </div>
  </div>

  <div class="app-name">HealthCare Plus</div>
  <div class="app-tagline">Your Health, Our Priority</div>

  <div class="spinner-container">
    <div class="spinner"></div>
  </div>

  <div class="loading-dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div class="loading-text">Loading your healthcare experience...</div>
</div>

<script>
  // Hide loading screen when Flutter is ready
  window.addEventListener('flutter-first-frame', function () {
    const loading = document.getElementById('loading');
    loading.classList.add('fade-out');

    // Remove the element completely after fade out
    setTimeout(() => {
      if (loading.parentNode) {
        loading.parentNode.removeChild(loading);
      }
    }, 500);
  });

  // Fallback: Hide loading screen after maximum wait time
  setTimeout(() => {
    const loading = document.getElementById('loading');
    if (loading) {
      loading.classList.add('fade-out');
      setTimeout(() => {
        if (loading.parentNode) {
          loading.parentNode.removeChild(loading);
        }
      }, 500);
    }
  }, 10000); // 10 seconds maximum
</script>

<script src="flutter_bootstrap.js" async></script>
</body>
</html>
